server:
  address: 127.0.0.1
  port: 8080

shrimp:
  proxy:
    timeout: 10s
    max-request-bytes: 1048576
    max-request-envelope-bytes: 2097152
    max-request-headers: 64
    max-request-header-bytes: 16384
    max-response-bytes: 2097152
    max-response-headers: 100
    max-response-header-line-length: 8192
    max-redirects: 5
